# Deploy the static site with GitHub Actions rather than the legacy Jekyll builder,
# which was failing on this repo even with .nojekyll present.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deliberately NOT the 'pages' group: the legacy pages-build-deployment workflow
# still exists on this repo and was cancelling this job by sharing that group.
concurrency:
  group: pages-actions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
